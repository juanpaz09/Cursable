name = "cursable-lector"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://juanpaz09.github.io"

# Hasta 3 lecturas por minuto por persona (IP). Protege tu saldo de Claude.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# La clave se carga aparte, nunca acá:  npx wrangler secret put ANTHROPIC_API_KEY
# (o en el panel de Cloudflare: Settings → Variables and Secrets)
