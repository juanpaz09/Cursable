<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cursable</title>
<meta name="description" content="Cargá tu plan de estudios, marcá tus materias y mirá qué podés cursar, qué pasa si abandonás una y qué finales rendir primero.">
<meta name="theme-color" content="#0e8584">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cursable">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: mapa de la carrera en cuadraditos por año; cada solapa muestra una sola idea con color y números grandes. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#14202b; --muted:#5a6876; --line:#d5dde3; --shade:rgba(20,32,43,.45);
  --accent:#1f5fa8; --accent-soft:#e3edf8;
  --c-falta:#8b97a3;    --t-falta:#ffffff;
  --c-cursando:#0e8584; --t-cursando:#dcf3f2;
  --c-regular:#2f62c4;  --t-regular:#e2eafb;
  --c-media:#b56a00;    --t-media:#fcefd9;
  --c-aprobada:#26843a; --t-aprobada:#dff1e3;
  --bad:#c23a2b; --bad-soft:#fbe4e1; --warn:#b56a00; --warn-soft:#fcefd9; --ok:#26843a; --ok-soft:#dff1e3;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --fg:#e4ebf0; --muted:#93a2af; --line:#2a3742; --shade:rgba(0,0,0,.6);
  --accent:#6ea6ec; --accent-soft:#1b2c40;
  --c-falta:#7d8a96;    --t-falta:#17212a;
  --c-cursando:#3cc0bd; --t-cursando:#123433;
  --c-regular:#7aa2f0;  --t-regular:#1b2a45;
  --c-media:#f0a640;    --t-media:#3a2a10;
  --c-aprobada:#5fc46f; --t-aprobada:#173322;
  --bad:#f07466; --bad-soft:#3a1c18; --warn:#f0a640; --warn-soft:#3a2a10; --ok:#5fc46f; --ok-soft:#173322;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --fg:#e4ebf0; --muted:#93a2af; --line:#2a3742; --shade:rgba(0,0,0,.6);
  --accent:#6ea6ec; --accent-soft:#1b2c40;
  --c-falta:#7d8a96;    --t-falta:#17212a;
  --c-cursando:#3cc0bd; --t-cursando:#123433;
  --c-regular:#7aa2f0;  --t-regular:#1b2a45;
  --c-media:#f0a640;    --t-media:#3a2a10;
  --c-aprobada:#5fc46f; --t-aprobada:#173322;
  --bad:#f07466; --bad-soft:#3a1c18; --warn:#f0a640; --warn-soft:#3a2a10; --ok:#5fc46f; --ok-soft:#173322;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
.wrap{max-width:900px;margin:0 auto;padding-block:16px calc(90px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.4rem}
h2{font-size:1.1rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* progreso de la carrera */
.prog{display:grid;gap:8px}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.strip i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* avisos */
.alerts{display:grid;gap:6px}
.alert{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;border:1px solid;text-align:left;width:100%;background:none}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert .big{font-family:var(--f-display);font-weight:700;font-size:1.2rem;min-width:3.2rem;text-align:center;line-height:1}
.alert.bad .big{color:var(--bad)} .alert.warn .big{color:var(--warn)}
.alert .big small{display:block;font-size:.65rem;font-family:var(--f-body);font-weight:600}

/* cuadraditos */
.year{display:grid;gap:8px}
.year-head{display:flex;align-items:baseline;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:2px;text-align:left;min-height:88px;padding:7px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--t-falta)}
.tile .n{font-family:var(--f-mono);font-weight:600;font-size:.78rem;color:var(--muted)}
.tile .nm{font-size:.76rem;line-height:1.2;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .st{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tile[data-e="cursando"]{background:var(--t-cursando);border-color:var(--c-cursando)} .tile[data-e="cursando"] .st{color:var(--c-cursando)}
.tile[data-e="regular"]{background:var(--t-regular);border-color:var(--c-regular)} .tile[data-e="regular"] .st{color:var(--c-regular)}
.tile[data-e="media"]{background:var(--t-media);border-color:var(--c-media)} .tile[data-e="media"] .st{color:var(--c-media)}
.tile[data-e="aprobada"]{background:var(--t-aprobada);border-color:var(--c-aprobada)} .tile[data-e="aprobada"] .st{color:var(--c-aprobada)}
.tile[data-e="falta"] .st{color:var(--muted)}
.tile.puede{border-style:dashed;border-color:var(--c-aprobada)}
.tile.puede .st{color:var(--c-aprobada)}
.tile .flag{position:absolute;top:6px;right:6px;font-size:.64rem;font-weight:700;border-radius:6px;padding:0 5px}
.tile .flag.bad{background:var(--bad);color:var(--surface)} .tile .flag.warn{background:var(--warn);color:var(--surface)}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px}
.tile .check{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.tile.sel .check{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tile .need{font-size:.66rem;font-weight:700;color:var(--c-regular)}
.mini{display:flex;flex-wrap:wrap;gap:4px}
.mini span{font-family:var(--f-mono);font-size:.75rem;font-weight:600;min-width:28px;text-align:center;padding:2px 5px;border-radius:6px;border:1.5px solid var(--line);background:var(--t-falta)}
.mini span.ok{border-color:var(--c-aprobada);background:var(--t-aprobada);color:var(--c-aprobada)}
.mini span.no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.mini span.fin{border-color:var(--c-regular);color:var(--c-regular);background:var(--t-regular)}

/* tabs abajo en celu, arriba en compu */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;position:relative}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs svg{width:20px;height:20px;flex:none}
.tabs .count{font-family:var(--f-mono);font-size:.7rem;background:var(--accent);color:var(--surface);border-radius:9px;padding:0 6px}
@media (max-width:640px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;
    padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .tabs button{flex-direction:column;gap:2px;border-bottom:0;border-top:3px solid transparent;padding:7px 2px 9px;font-size:.7rem}
  .tabs button[aria-selected="true"]{border-top-color:var(--accent);color:var(--accent)}
  .tabs .count{position:absolute;top:3px;left:calc(50% + 6px);font-size:.62rem;padding:0 5px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}

.panel{display:grid;gap:18px}
.sec{display:grid;gap:8px}
details.sec>summary{cursor:pointer;font-weight:600;padding:6px 0}
.sec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--f-display);font-weight:700;font-size:.85rem;border-radius:12px;padding:1px 9px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.fin{background:var(--t-regular);color:var(--c-regular)} .badge.gray{background:var(--line);color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.empty{padding:18px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;text-align:center}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.unlock{display:flex;flex-wrap:wrap;gap:6px}
.unlock span{background:var(--surface);border:1.5px solid var(--c-regular);border-radius:8px;padding:4px 8px;font-size:.8rem}
.unlock b{color:var(--c-regular);font-family:var(--f-display)}

/* armar */
.total{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.total-row{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.total b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}
.meter.over i{background:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:.88rem;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.opt-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* y si / finales */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.card-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-head .nm{font-weight:600;min-width:0}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num-box{border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.num-box b{font-family:var(--f-display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.num-box span{font-size:.75rem;font-weight:600}
.num-box.bad{background:var(--bad-soft);color:var(--bad)} .num-box.ok{background:var(--ok-soft);color:var(--ok)} .num-box.zero{background:var(--bg);color:var(--muted)}
.tag{font-size:.7rem;font-weight:700;border-radius:8px;padding:2px 8px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.info{background:var(--t-regular);color:var(--c-regular)}
.rank{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.rank .pos{font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--muted);text-align:center}
.rank .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.rank .bar i{display:block;height:100%;background:var(--c-regular)}
.rank .abre{text-align:center;line-height:1}
.rank .abre b{font-family:var(--f-display);font-size:1.5rem;color:var(--c-aprobada);display:block}
.rank .abre small{font-size:.65rem;color:var(--muted);font-weight:600}

/* ficha */
.backdrop{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-width:560px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h2{font-size:1.2rem}
.close{background:var(--bg);border:0;border-radius:50%;width:34px;height:34px;font-size:1.1rem;flex:none}
.states{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.states button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;font-weight:600;display:flex;align-items:center;gap:8px;text-align:left}
.states button:last-child{grid-column:1 / -1}
.states button[aria-pressed="true"]{color:var(--surface)}
.states button[data-v="falta"][aria-pressed="true"]{background:var(--c-falta);border-color:var(--c-falta)}
.states button[data-v="cursando"][aria-pressed="true"]{background:var(--c-cursando);border-color:var(--c-cursando)}
.states button[data-v="regular"][aria-pressed="true"]{background:var(--c-regular);border-color:var(--c-regular)}
.states button[data-v="media"][aria-pressed="true"]{background:var(--c-media);border-color:var(--c-media)}
.states button[data-v="aprobada"][aria-pressed="true"]{background:var(--c-aprobada);border-color:var(--c-aprobada)}
.field{display:grid;gap:4px;font-size:.85rem;font-weight:600}
.field input{font:inherit;font-size:1rem;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg)}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

footer{font-size:.78rem;color:var(--muted);display:grid;gap:8px}
footer summary{cursor:pointer;font-weight:600}
textarea{width:100%;min-height:80px;font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:8px}
/* carrera y carga de planes */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.planbtn{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:.85rem;font-weight:600;max-width:100%}
.planbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.cargando .main-ui,body.cargando .main-ui-p{display:none!important}
body:not(.cargando) #panel-cargar{display:none!important}
body.bienvenida .main-ui,body.bienvenida .main-ui-p,body.bienvenida #b-plan{display:none!important}
body:not(.bienvenida) #panel-bienvenida,body.cargando #panel-bienvenida{display:none!important}
.hero{display:grid;gap:10px;justify-items:center;text-align:center;padding:18px 0 6px}
.hero svg{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.15)}
.hero h2{font-size:1.6rem;margin:0}
.hero p{margin:0;color:var(--muted);max-width:30rem}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;font-size:.8rem;color:var(--muted)}
.feats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:grid;gap:4px;justify-items:center}
.feats b{font-size:1.3rem;color:var(--accent)}
.hola{font-size:.85rem;color:var(--muted)}
.syncbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;color:var(--fg);font-size:.9rem}
.syncbox .cod{font-family:var(--f-mono);font-size:1.35rem;font-weight:700;letter-spacing:.04em;color:var(--accent);word-break:break-all}
.syncbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.syncbox .inp{flex:1;min-width:10rem;text-transform:uppercase}
.big-opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%}
.big-opt .ic{grid-row:span 2;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:1.2rem;font-weight:700}
.big-opt b{font-size:1rem}
.big-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;display:grid;gap:6px;background:var(--surface);cursor:pointer;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.inp{font:inherit;font-size:.9rem;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.inp.err{border-color:var(--bad);background:var(--bad-soft)}
.ed{display:grid;gap:8px}
.ed-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px}
.ed-l1{display:grid;grid-template-columns:4.2rem minmax(0,1fr) auto;gap:6px;align-items:center}
.ed-l2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ed-l3{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed-row label{display:grid;gap:2px;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ed-row label .inp{text-transform:none;letter-spacing:0;font-weight:400}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;width:32px;height:32px;border-radius:8px}
.status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.dudas{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-size:.88rem}
.dudas ul{margin:4px 0 0;padding-left:18px}
.planlist{display:grid;gap:6px}
.res{display:grid;gap:6px}
.res-it{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;color:var(--fg)}
.res-it b{font-size:.98rem}
.res-it:hover,.big-opt:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.ver-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.ver-card h3{margin:0;font-family:var(--f-disp,inherit);font-size:1.15rem}

.ver-m .c{font-family:var(--f-mono);font-size:.78rem;font-weight:700;color:var(--muted);padding-top:2px}

<script>
// [n, nombre, horas semanales, regulares para cursar, aprobadas para cursar]
const ANUALES = [
 [1,'Análisis Matemático I',5,[],[]],
 [2,'Química General',5,[],[]],
 [3,'Sistemas de Representación',3,[],[]],
 [4,'Informática I',3,[],[]],
 [5,'Pensamiento Sistémico',3,[],[]],
 [6,'Física I',5,[],[]],
 [7,'Álgebra y Geometría Analítica',5,[],[]],
 [8,'Ingeniería y Sociedad',2,[],[]],
 [9,'Análisis Matemático II',5,[1,7],[]],
 [10,'Administración General',4,[4,5,7,8],[]],
 [11,'Probabilidad y Estadística',3,[1,7],[]],
 [12,'Ciencias de los Materiales',4,[2,6],[]],
 [13,'Física II',5,[1,6],[]],
 [14,'Economía General',4,[1,5,8],[]],

 [21,'Estática y Resistencia de los Materiales',4,[9,12],[1,2,6,7]],

 [23,'Economía de la Empresa',3,[10,14],[1,4,5,7,8]],
 [24,'Electrotecnia y Máquinas Eléctricas',5,[13],[1,6]],
 [25,'Análisis Numérico y Cálculo Avanzado',2,[9],[1,7]],
 [26,'Seguridad, Higiene e Ingeniería Ambiental',3,[18],[10,11]],
 [27,'Investigación Operativa',4,[9,11,25],[1,7]],
 [28,'Procesos Industriales',5,[18,20,24],[2,10,12,13]],
 [29,'Mecánica y Mecanismos',3,[9],[1,6,7]],
 [30,'Evaluación de Proyectos',5,[17,18,19,23],[10,11,14,16]],
 [31,'Planificación y Control de la Producción',4,[18],[10,11]],
 [32,'Diseño de Producto',2,[15,19],[3,4,10,11,14]],
 [33,'Inglés II',2,[16],[]],
 [34,'Instalaciones Industriales',3,[20,21,22,24],[2,9,12,13]],
 [35,'Legislación',2,[],[10]],
 [36,'Mantenimiento',3,[34],[20,21,24]],
 [37,'Manejo de Materiales y Distribución de Planta',3,[18,29],[9,10,21]],
 [38,'Comercio Exterior',3,[30],[18,19,23]],
 [39,'Relaciones Industriales',3,[18],[10,11]],
 [40,'Ingeniería en Calidad',3,[18],[10,11]],
 [41,'Control de Gestión',3,[17,23],[10,14]],
 [42,'Proyecto Final',6,[25,26,27,28,30,31],[18,19,20,21,22,23,24,33]],
];
const NIVEL = n => n<=8?1:n<=16?2:n<=25?3:n<=35?4:5;
// [id, nombre, cuatrimestre, horas, créditos, regulares, aprobadas, nota]
const ELECTIVAS = [
 ['E1','Gestión Ambiental','1C',4,2,[26],[5]],
 ['E2','Gestión de Proyectos','1C',4,2,[27,31,32],[10,14,17,18]],
 ['E3','Gestión Emprendedora','1C',4,2,[30,31],[10,17,19,23]],
 ['E4','Logística','1C',4,2,[27,30,31],[18,23]],
 ['E5','Política Económica','2C',4,2,[30],[19,23]],
 ['E6','Energías Renovables','1C',4,2,[20,24,26,28,32],[2]],
 ['E7','Gestión del Conocimiento, la Innovación y Economía Crítica','2C',4,2,[18,27],[10,25]],
 ['E8','Coaching de Formadores','2C',6,3,[17,18,19],[10,14]],
 ['E9','Simulación','2C',6,3,[27,30,31,32],[18]],
 ['E10','Análisis de Datos I','2C',4,2,[25,27],[10,11,14,15,33],'En el PDF la celda de aprobadas se corta (“…15-3 / 3”); supuse que es 33 (Inglés II).'],
 ['E11','Sustentabilidad y Nuevas Economías','1C',4,2,[17,18,19,30],[10,14]],
 ['E12','CNH Cátedra IN STU','2C',4,2,[27,31,32],[10,14,17,18,19]],
];
const IND_CRED = 10;

// ---------- Planes ----------
// Un plan: {id, nombre, fuente, creditosReq, materias:[{id, nombre, hs, nivel, reg, apr, tipo:'anual'|'cuatrimestral'|'electiva', cuat, creditos, nota}]}
const PLAN_IND = {
  id:'ind2023', nombre:'Ingeniería Industrial · Plan 2023 (UTN FRC)', builtin:true, creditosReq:IND_CRED,
  uni:'UTN · Facultad Regional Córdoba', ciudad:'Córdoba', pais:'Argentina',
  fuente:'Correlativas para cursar del Plan 2023 (actualizado 03/02/2025). Proyecto Final además pide la PPS.',
  materias:[
    ...ANUALES.map(([n,nombre,hs,reg,apr])=>({id:String(n),nombre,hs,nivel:NIVEL(n),reg:reg.map(String),apr:apr.map(String),tipo:'anual',creditos:0})),
    ...ELECTIVAS.map(([id,nombre,cuat,hs,cr,reg,apr,nota])=>({id,nombre,hs,nivel:null,reg:reg.map(String),apr:apr.map(String),tipo:'electiva',cuat,creditos:cr,nota})),
  ],
};

// ---------- Estado guardado ----------
const KEY='estado-academico-v2', OLDKEY='estado-academico-industrial-2023-v1';
const DEF = () => ({planId:'ind2023', planes:{}, prog:{}, cfg:{aviso:60, horas:24}, perfil:{nombre:'',uni:'',ciudad:'',pais:'Argentina'}, inicio:false, sync:{codigo:'',t:0}, mod:0});
let S = DEF();
// datos de antes de la bienvenida: si ya marcó materias o cargó carreras, no se la mostramos
function yaUsada(x){ return Object.keys(x.planes||{}).length>0 || Object.values(x.prog||{}).some(g=>Object.keys(g?.m||{}).length>0); }
try{
  const raw=localStorage.getItem(KEY);
  if(raw){ const p=JSON.parse(raw); S=Object.assign(DEF(),p); S.cfg=Object.assign(DEF().cfg,p.cfg||{}); S.perfil=Object.assign(DEF().perfil,p.perfil||{}); if(p.inicio===undefined) S.inicio=yaUsada(S); }
  else { const old=localStorage.getItem(OLDKEY); if(old){ const p=JSON.parse(old); S.prog.ind2023={m:p.m||{}, sel:p.sel||[]}; S.cfg=Object.assign(S.cfg,{aviso:p.cfg?.aviso||60, horas:p.cfg?.horas||24}); S.inicio=true; } }
}catch(e){}
S.cfg.proyectar=false; // solo cuenta lo que ya regularizaste de verdad
function guardarLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ S.mod=Date.now(); guardarLocal(); programarSync(); }
const planes = () => [PLAN_IND, ...Object.values(S.planes)];
const planById = id => id==='ind2023' ? PLAN_IND : S.planes[id];
const P = () => (S.prog[S.planId] ||= {m:{}, sel:[]});

let PLAN, MATERIAS, BY, CREDITOS_REQ, NIVELES, _cad;
function usarPlan(id){
  if(!planById(id)) id='ind2023';
  S.planId=id; PLAN=planById(id);
  MATERIAS=PLAN.materias.map(m=>({...m, num:/^\d+$/.test(m.id)?+m.id:null}));
  BY=Object.fromEntries(MATERIAS.map(m=>[m.id,m]));
  CREDITOS_REQ=+PLAN.creditosReq||0;
  NIVELES=[...new Set(MATERIAS.filter(m=>m.tipo!=='electiva').map(m=>m.nivel||1))].sort((a,b)=>a-b);
  _cad={}; SUG=null;
}
const ESTADOS = [['falta','Me falta'],['cursando','Cursando'],['regular','Regular'],['media','Media promo'],['aprobada','Aprobada']];
const TXT = {falta:'Falta',cursando:'Cursando',regular:'Regular',media:'Media promo',aprobada:'Aprobada'};
const cod = id => BY[id]?.id ?? id;
const label = id => BY[id] ? (/^\d+$/.test(id) ? `${id}. ${BY[id].nombre}` : `${BY[id].nombre} (${id})`) : id;
const oblig = () => MATERIAS.filter(m=>m.tipo!=='electiva');

let OVR=null;
const st = id => (OVR && OVR[id]) || (P().m[id] && P().m[id].e) || 'falta';
const rec = id => (P().m[id] ||= {e:'falta'});
function con(ovr, fn, proy){ const p=OVR, pp=S.cfg.proyectar; OVR=ovr; if(proy!==undefined) S.cfg.proyectar=proy; try{ return fn(); } finally{ OVR=p; S.cfg.proyectar=pp; } }

// ---------- Lógica ----------
const esReg = id => ['regular','media','aprobada'].includes(st(id)) || (S.cfg.proyectar && st(id)==='cursando');
const esApr = id => st(id)==='aprobada';
const hoy = (()=>{const d=new Date(); d.setHours(0,0,0,0); return d;})();
function diasHasta(f){ if(!f) return null; const d=new Date(f+'T00:00:00'); if(isNaN(d)) return null; return Math.round((d-hoy)/86400000); }
function fmtFecha(f){ return new Date(f+'T00:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}); }
function urgenciaMedia(id){
  const d=diasHasta(P().m[id]?.vence);
  if(d===null) return {nivel:'sin',d};
  if(d<0) return {nivel:'vencida',d};
  if(d<=S.cfg.aviso) return {nivel:'pronto',d};
  return {nivel:'ok',d};
}
function faltantes(id, extraApr){
  const m=BY[id];
  return {reg:m.reg.filter(r=>BY[r]&&!esReg(r)), apr:m.apr.filter(a=>BY[a]&&!esApr(a)&&a!==extraApr)};
}
function analisisProximo(){
  const pod=[], fin=[], lejos=[];
  for(const m of MATERIAS){
    if(st(m.id)!=='falta') continue;
    const f=faltantes(m.id);
    if(!f.reg.length && !f.apr.length) pod.push(m);
    else if(!f.reg.length && f.apr.every(esReg)) fin.push({m,f});
    else lejos.push({m,f});
  }
  return {pod,fin,lejos};
}
function cadenaDe(id, seen=new Set()){
  if(_cad[id]) return _cad[id];
  seen.add(id);
  const set=new Set();
  for(const x of MATERIAS) if((x.reg.includes(id)||x.apr.includes(id)) && !seen.has(x.id)){ set.add(x.id); for(const y of cadenaDe(x.id,seen)) set.add(y); }
  seen.delete(id);
  return _cad[id]=set;
}
function analisisFinales(){
  const out=[];
  for(const m of MATERIAS){
    const e=st(m.id);
    if(!(e==='regular'||e==='media')) continue;
    const deps=MATERIAS.filter(x=>st(x.id)==='falta' && x.apr.includes(m.id));
    const destraba=deps.filter(x=>{const f=faltantes(x.id,m.id); return !f.reg.length && !f.apr.length;});
    const cadena=cadenaDe(m.id).size;
    const u=e==='media'?urgenciaMedia(m.id):null;
    let score=destraba.length*3 + deps.length + Math.min(cadena,20)/4;
    if(u&&u.nivel==='pronto') score+=4;
    if(u&&u.nivel==='vencida') score+=2;
    out.push({m,e,deps,destraba,cadena,u,score});
  }
  return out.sort((a,b)=>b.score-a.score || a.m.id.localeCompare(b.m.id,undefined,{numeric:true}));
}
function ovrBase(){ const o={}; for(const m of MATERIAS) if(st(m.id)==='cursando') o[m.id]='regular'; return o; }
function evalSel(sel, nowIds){
  const o=ovrBase(); sel.forEach(id=>o[id]='regular');
  const r=con(o, analisisProximo, true);
  return {nuevas:r.pod.filter(m=>!nowIds.has(m.id)), conFin:r.fin.filter(x=>!nowIds.has(x.m.id))};
}
const horas = sel => sel.reduce((a,id)=>a+(+BY[id].hs||0),0);
const puntaje = (ev,sel) => ev.nuevas.length*2 + ev.conFin.length + sel.reduce((a,id)=>a+cadenaDe(id).size,0)/50;
let SUG=null;
function sugerir(cands, budget){
  const c=cands.filter(m=>m.tipo!=='electiva').sort((a,b)=>cadenaDe(b.id).size-cadenaDe(a.id).size);
  const nowIds=new Set(cands.map(m=>m.id));
  const best=[];
  const push=(sel,hs)=>{ const ev=evalSel(sel,nowIds); const k=[...sel].sort().join(','); if(best.some(b=>b.k===k)) return;
    best.push({k,sel:[...sel],score:puntaje(ev,sel),hs,ev}); best.sort((a,b)=>b.score-a.score||b.hs-a.hs); if(best.length>3) best.length=3; };
  const h=m=>+m.hs||0;
  if(c.length<=16){
    const go=(i,sel,hs)=>{
      if(i===c.length){ if(sel.length && !c.some(x=>!sel.includes(x.id)&&hs+h(x)<=budget)) push(sel,hs); return; }
      if(hs+h(c[i])<=budget){ sel.push(c[i].id); go(i+1,sel,hs+h(c[i])); sel.pop(); }
      go(i+1,sel,hs);
    };
    go(0,[],0);
  } else { const sel=[]; let hs=0; for(const m of c) if(hs+h(m)<=budget){ sel.push(m.id); hs+=h(m); } if(sel.length) push(sel,hs); }
  return best;
}

// ---------- Render ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=(n,a,b)=>n===1?a:b;
const tipoTxt = m => m.tipo==='electiva'?`Electiva${m.cuat?' · '+m.cuat:''}${m.creditos?` · ${m.creditos} créd.`:''}`:m.tipo==='cuatrimestral'?`${m.nivel||1}.º año · ${m.cuat||'cuatrim.'}`:`${m.nivel||1}.º año`;

function renderHeader(){
  document.body.classList.toggle('bienvenida', !S.inicio);
  if(!S.inicio) renderBienvenida();
  $('#plan-name').textContent=PLAN.nombre;
  $('#plan-fuente').textContent=PLAN.fuente||'';
}

function renderProg(){
  const ob=oblig(), N=ob.length||1;
  const c={aprobada:0,media:0,regular:0,cursando:0,falta:0};
  ob.forEach(m=>c[st(m.id)]++);
  const cred=MATERIAS.filter(m=>m.tipo==='electiva'&&esApr(m.id)).reduce((a,m)=>a+(+m.creditos||0),0);
  const order=['aprobada','media','regular','cursando'];
  $('#prog').innerHTML=`
    <div class="strip" role="img" aria-label="${c.aprobada} de ${ob.length} aprobadas">${order.map(k=>c[k]?`<i style="width:${c[k]/N*100}%;background:var(--c-${k})"></i>`:'').join('')}</div>
    <div class="legend">${order.map(k=>`<span><i class="dot" style="background:var(--c-${k})"></i>${TXT[k]} <b>${c[k]}</b></span>`).join('')}
      <span><i class="dot" style="background:var(--line)"></i>Falta <b>${c.falta}</b></span>
      ${CREDITOS_REQ?`<span class="muted">Electivas <b>${cred}/${CREDITOS_REQ}</b> créd.</span>`:''}</div>`;
}

function renderAlerts(){
  const items=[];
  for(const m of MATERIAS){
    if(st(m.id)!=='media') continue;
    const u=urgenciaMedia(m.id);
    if(u.nivel==='vencida') items.push({id:m.id,c:'bad',big:'!',sub:'vencida',t:`Se venció la media promo de <b>${esc(m.nombre)}</b>`,o:-1});
    else if(u.nivel==='pronto') items.push({id:m.id,c:'warn',big:u.d,sub:pl(u.d,'día','días'),t:`para que venza la media promo de <b>${esc(m.nombre)}</b>`,o:u.d});
    else if(u.nivel==='sin') items.push({id:m.id,c:'warn',big:'?',sub:'sin fecha',t:`Cargá cuándo vence la media promo de <b>${esc(m.nombre)}</b>`,o:999});
  }
  items.sort((a,b)=>a.o-b.o);
  $('#alerts').innerHTML=items.map(x=>`<button type="button" class="alert ${x.c}" data-open="${esc(x.id)}"><span class="big">${x.big}<small>${x.sub}</small></span><span>${x.t}</span></button>`).join('');
}

function tile(m, opts={}){
  const e=st(m.id);
  let flag='', stTxt=TXT[e], cls='';
  if(e==='media'){ const u=urgenciaMedia(m.id);
    if(u.nivel==='vencida') flag='<span class="flag bad">vencida</span>';
    else if(u.nivel==='pronto') flag=`<span class="flag warn">${u.d} d</span>`;
    else if(u.nivel==='sin') flag='<span class="flag warn">?</span>'; }
  if(opts.puede && e==='falta'){ cls=' puede'; stTxt='Podés cursar'; }
  if(opts.select!==undefined){ cls+=opts.select?' sel':''; flag=`<span class="check" aria-hidden="true">${opts.select?'✓':''}</span>`; stTxt=`${+m.hs||0} h/sem`; }
  if(opts.need) stTxt=`<span class="need">${opts.need}</span>`;
  const attr = opts.select!==undefined ? `data-toggle="${esc(m.id)}" aria-pressed="${!!opts.select}"` : `data-open="${esc(m.id)}"`;
  return `<button type="button" class="tile${cls}" data-e="${opts.select!==undefined?'falta':e}" ${attr} aria-label="${esc(label(m.id))}: ${esc(TXT[e])}">
    <span class="n">${esc(cod(m.id))}</span><span class="nm">${esc(m.nombre)}</span><span class="st">${stTxt}</span>${flag}</button>`;
}

function renderPlan(){

function renderYsi(){
  const curs=MATERIAS.filter(m=>st(m.id)==='cursando');
  if(!curs.length){ $('#panel-ysi').innerHTML='<div class="empty">Marcá en el Mapa las materias que estás cursando y acá ves qué pasa si dejás alguna.</div>'; return; }
  const base=ovrBase();
  const rB=con(base, analisisProximo, true);
  const bPod=new Set(rB.pod.map(m=>m.id));
  const near=new Set([...rB.pod.map(x=>x.id),...rB.fin.map(x=>x.m.id)]);
  const items=curs.map(m=>{
    const bloquea=MATERIAS.filter(x=>st(x.id)==='falta' && (x.reg.includes(m.id)||x.apr.includes(m.id)));
    const pronto=bloquea.filter(x=>near.has(x.id));

    const ap=con({...base,[m.id]:'aprobada'}, analisisProximo, true);
    const gana=ap.pod.filter(x=>!bPod.has(x.id));
    const cad=cadenaDe(m.id).size;
    return {m,pronto,despues,gana,cad,imp:pronto.length*3+bloquea.length/2+cad/10};
  }).sort((a,b)=>a.imp-b.imp);
  const mini=(arr,cls,style='')=>arr.map(p=>`<span class="${cls}" style="${style}" title="${esc(label(p.id))}">${esc(cod(p.id))}</span>`).join('');

const splitCods = t => String(t||'').split(/[\s,;/+-]+/).map(x=>x.trim()).filter(Boolean);
function validarEd(){
  const errs=[]; const ids=ED.materias.map(m=>m.id.trim());
  const set=new Set();
  ED.materias.forEach((m,i)=>{ const id=m.id.trim();
    if(!id) errs.push({i,f:'id',t:`La materia ${i+1} no tiene código`});
    else if(set.has(id)) errs.push({i,f:'id',t:`El código ${id} está repetido`});
    set.add(id);
    if(!m.nombre.trim()) errs.push({i,f:'nombre',t:`La materia ${id||i+1} no tiene nombre`});
  });
  ED.materias.forEach((m,i)=>{
    for(const f of ['reg','apr']) for(const c of splitCods(m[f])) if(!set.has(c)) errs.push({i,f,t:`${m.nombre||m.id}: la correlativa “${c}” no existe en el plan`});
  });
  if(!ED.nombre.trim()) errs.push({i:-1,f:'nombre',t:'Ponele un nombre a la carrera'});
  if(ED.compartir&&LECTOR_URL) for(const [f,t] of [['uni','la universidad'],['ciudad','la ciudad'],['pais','el país']])
    if(!String(ED[f]||'').trim()) errs.push({i:-1,f,t:`Para compartirlo en el banco falta ${t}`});
  if(!ED.materias.length) errs.push({i:-1,f:'',t:'El plan no tiene materias'});
  return errs;
}

// --- PDF: se carga pdf.js recién cuando hace falta
let pdfjsP=null;
function cargarScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('No pude cargar el lector de PDF')); document.head.appendChild(s); }); }
function pdfjs(){
  return pdfjsP ||= (async()=>{
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'); // define pdfjsWorker: corre sin worker aparte
    return window.pdfjsLib;
  })();
}
async function leerPdf(file, maxImgs){
  const lib=await pdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let texto='';
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i);
    const tc=await page.getTextContent();
    // reconstruir renglones por posición vertical, con " | " entre columnas
    const rows=[];
    for(const it of tc.items){ if(!it.str?.trim()) continue; const y=Math.round(it.transform[5]); const x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<=3); if(!r) rows.push(r={y,items:[]}); r.items.push({x,w:it.width||0,s:it.str}); }
    rows.sort((a,b)=>b.y-a.y);
    texto+=`\n--- Página ${i} ---\n`+rows.map(r=>{ r.items.sort((a,b)=>a.x-b.x); let line='', end=null;
      for(const it of r.items){ if(end!==null) line+= (it.x-end>12)?' | ':' '; line+=it.s; end=it.x+it.w; } return line; }).join('\n');
  }
  const imgs=[];
  if(texto.replace(/[\s|-]|Página \d+/g,'').length<300 && maxImgs){ // PDF escaneado: mandamos las páginas como imágenes
    for(let i=1;i<=Math.min(doc.numPages,maxImgs);i++){
      const page=await doc.getPage(i); const vp=page.getViewport({scale:1.6});
      const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      imgs.push(await new Promise(r=>cv.toBlob(r,'image/png')));
    }
    texto='';
  }
  return {texto, imgs};
}

- No inventes correlativas. Si una celda está cortada o es ambigua, poné tu mejor lectura y explicala en "dudas" (frases cortas en castellano).`;

async function leerConClaude(){
  const nombre=$('#c-nombre')?.value.trim()||'';
  const files=CARGA.archivos;
  if(!files.length){ CARGA.error='Elegí primero el PDF o las fotos del plan.'; renderCargar(); return; }
  CTL=new AbortController();
  CARGA.estado='Leyendo el archivo…'; CARGA.error=null; renderCargar();
  if(!SAMPLE && LECTOR_OK) return leerConServidor(nombre, files);
  try{
    const lim=await SAMPLE.limits().catch(()=>null);
    const maxImgs=lim?.images?.maxCount||0;
    let texto='', imgs=[];
    for(const f of files){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){ const r=await leerPdf(f, Math.max(0,maxImgs-imgs.length)); texto+=r.texto; imgs.push(...r.imgs); }
      else if(f.type.startsWith('image/')) imgs.push(f);
    }
    if(!texto.trim() && !imgs.length) throw {code:'vacio'};
    if(imgs.length && !maxImgs) throw {code:'images_unavailable'};
    CARGA.estado='Claude está leyendo tu plan… puede tardar uno o dos minutos.'; renderCargar();
    const j=await SAMPLE.json(PROMPT(nombre,texto,imgs.length>0), {signal:CTL.signal, images:imgs.length?imgs.slice(0,maxImgs):undefined});
    if(!Array.isArray(j?.materias)||!j.materias.length) throw {code:'sin_materias'};
    ED=completarLugar(jsonAEd(j, nombre)); CARGA.paso='revisar'; CARGA.estado=null;
  }catch(e){
    CARGA.estado=null;
    const c=e?.code;
    CARGA.error = c==='cancelled'?null
      : c==='not_granted'||c==='sampling_disabled'?'No se pudo usar Claude desde la app. Podés cargar el plan a mano.'
      : c==='rate_limited'?'Llegaste al límite de uso de Claude por ahora. Probá más tarde.'
      : c==='prompt_too_large'?'El documento es muy largo. Subí solo las páginas del régimen de correlativas.'
      : c==='images_unavailable'?'Este PDF parece escaneado y desde acá no puedo mandar imágenes. Probá con un PDF con texto o cargalo a mano.'
      : c==='vacio'?'No encontré texto en el archivo.'
      : c==='sin_materias'||c==='invalid_json'?'Claude no pudo armar un plan con ese archivo. Probá con otro archivo o cargalo a mano.'
      : (e?.message||'Algo falló al leer el archivo. Probá de nuevo.');
  }
  CTL=null; renderCargar(); window.scrollTo(0,0);
}

// Versión pública: el PDF va a nuestro servidor, que se lo pasa a Claude
const aB64 = f => new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=ko; r.readAsDataURL(f); });
async function leerConServidor(nombre, files){
  try{
    const pdf=files.find(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
    const imgs=files.filter(f=>f.type.startsWith('image/')).slice(0,10);
    if(files.reduce((a,f)=>a+f.size,0)>8*1024*1024) throw {code:'muy_grande'};
    const body={nombre, pdf:pdf?await aB64(pdf):undefined, imagenes:await Promise.all(imgs.map(async f=>({media_type:f.type,data:await aB64(f)})))};
    CARGA.estado='Claude está leyendo tu plan… puede tardar uno o dos minutos.'; renderCargar();
    const r=await fetch(LECTOR_URL.replace(/\/$/,'')+'/leer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:CTL.signal});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw {code:j.error||'error'};
    if(!Array.isArray(j.plan?.materias)||!j.plan.materias.length) throw {code:'sin_materias', dudas:j.plan?.dudas};
    ED=completarLugar(jsonAEd(j.plan, nombre)); CARGA.paso='revisar'; CARGA.estado=null;
  }catch(e){
    CARGA.estado=null;
    const c=e?.code||(e?.name==='AbortError'?'cancelled':'');
    CARGA.error = c==='cancelled'?null
      : c==='muchos_pedidos'?'Probaste muchas veces seguidas. Esperá un minuto y volvé a intentar.'
      : c==='muy_grande'?'El archivo es muy pesado (máximo 8 MB). Subí solo las páginas de las correlativas.'
      : c==='ocupado'?'El lector está con mucha demanda. Probá en unos minutos.'
      : c==='sin_materias'?('No encontré un plan en ese archivo.'+(e.dudas?.length?' '+e.dudas.join(' '):''))
      : c==='archivo_no_valido'?'No pude abrir ese archivo. Probá con otro PDF o con fotos.'
      : 'No se pudo leer el plan. Revisá tu conexión y probá de nuevo, o cargalo a mano.';
  }
  CTL=null; renderCargar(); window.scrollTo(0,0);
}

function parsePegado(txt){
  const s=String(txt||''), a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<a) throw 0;
  const j=JSON.parse(s.slice(a,b+1)); const p=j.plan||j;
  if(!Array.isArray(p.materias)||!p.materias.length) throw 0;
  const m0=p.materias[0]||{};
  if('codigo' in m0||'regulares' in m0||'anio' in m0){ const ed=jsonAEd(p,''); ed.fuente='Plan armado con tu IA y revisado por vos.'; return ed; }
  const ed=planAEd({...p, id:nuevoId(), nombre:p.nombre||'', banco:'', builtin:false,
    materias:p.materias.map(m=>({...m,id:String(m.id),reg:(m.reg||[]).map(String),apr:(m.apr||[]).map(String)}))});
  ed.fuente=p.fuente||''; return ed;
}

let SYNC_T=null, SYNC_EST='';
const limpiarCodigo = c => String(c||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'');
function programarSync(){

async function subirSync(keepalive){

    const r=await fetch(API()+'/sync/'+encodeURIComponent(S.sync.codigo),{method:'PUT',headers:{'Content-Type':'application/json'},body,keepalive:!!keepalive&&body.length<60000});
    if(!r.ok) throw 0; const j=await r.json(); S.sync.t=j.t||Date.now(); SYNC_EST='ok'; guardarLocal();

async function traerCodigo(codigo){
  const r=await fetch(API()+'/sync/'+encodeURIComponent(codigo),{cache:'no-store'});
  if(r.status===404) throw {code:'no_existe'};
  if(!r.ok) throw {code:'red'};
  return r.json();
}

  try{ const g=await traerCodigo(codigo); aplicarRespaldo(g.datos); S.sync={codigo,t:g.t}; S.mod=g.datos.mod||Date.now(); guardarLocal(); SYNC_EST='ok'; renderAll(); return true; }
  catch(e){ msgEl.textContent= e?.code==='no_existe'?'No encontré ese código. Fijate que esté bien escrito.':'No me pude conectar. Probá de nuevo.'; return false; }
}
function renderSync(){
  const el=$('#sync-box'); if(!el) return;
  if(!LECTOR_URL){ el.innerHTML=''; return; }
  const c=S.sync?.codigo;
  if(!c){ el.innerHTML=`<div class="syncbox">
      <b>📱 ¿Cambiás de celu o la querés abrir en otro lado?</b>
      <span class="muted small">Creá tu código personal. Con ese código abrís tu avance en cualquier dispositivo, sin cuenta ni contraseña.</span>
      <button type="button" class="btn primary" id="s-crear" ${SYNC_EST==='creando'?'disabled':''}>${SYNC_EST==='creando'?'Creando…':'Crear mi código'}</button>
      ${SYNC_EST==='error-crear'?`<span class="small" style="color:var(--bad)">No pude crear el código. Probá de nuevo.</span>`:''}
      <details class="sec"><summary>Ya tengo un código</summary><div class="row"><input id="s-cod" class="inp" placeholder="PUMA-ROBLE-1234" autocomplete="off"><button type="button" class="btn" id="s-entrar">Entrar</button></div><span id="s-msg" class="muted small"></span>
        <span class="muted small">Ojo: reemplaza lo que tengas en este celu por lo guardado en ese código.</span></details></div>`; return; }
  const hora=S.sync.t?new Date(S.sync.t).toLocaleString('es-AR',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  el.innerHTML=`<div class="syncbox">
      <span class="muted small">Tu código personal</span>
      <div class="row"><span class="cod">${esc(c)}</span><button type="button" class="btn" id="s-copiar">Copiar</button></div>
      <span class="muted small">${SYNC_EST==='error'?'⚠ No se pudo guardar. Se reintenta cuando hagas otro cambio.':SYNC_EST==='pendiente'?'Guardando en unos segundos…':`✓ Se guarda solo${hora?` · último guardado ${hora}`:''}`}</span>
      <span class="muted small">Anotalo: en otro celu lo ponés al empezar y aparece todo. No se lo pases a nadie que no quieras que vea tu avance.</span>
      <details class="sec"><summary>Dejar de usar este código acá</summary><button type="button" class="btn" id="s-salir">Desvincular este celu</button><span class="muted small">Tu avance sigue en este celu y en el código, pero deja de guardarse.</span></details>
    </div>`;
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&SYNC_T) subirSync(true); });

function abrirCargar(modo){
  OPEN=null; renderSheet();
  if(modo==='editar'){ ED=planAEd(PLAN); ED.compartir=false; CARGA={paso:'revisar',estado:null,error:null,archivos:[],q:''}; }
  else { ED=null; CARGA={paso:'inicio',estado:null,error:null,archivos:[],q:'',pdf:false}; }
  document.body.classList.add('cargando'); renderCargar(); window.scrollTo(0,0);
}
function cerrarCargar(){ CTL?.abort(); document.body.classList.remove('cargando'); ED=null; renderAll(); }

function edRow(m,i){
  return `<div class="ed-row" data-i="${i}">
    <div class="ed-l1"><input class="inp" data-f="id" value="${esc(m.id)}" aria-label="Código" placeholder="Cód."><input class="inp" data-f="nombre" value="${esc(m.nombre)}" aria-label="Nombre" placeholder="Nombre de la materia"><button type="button" class="x" data-del="${i}" aria-label="Quitar materia">✕</button></div>
    <div class="ed-l2">
      <label>Año<input class="inp" type="number" min="1" max="8" data-f="nivel" value="${esc(m.nivel)}"></label>
      <label>Tipo<select class="inp" data-f="tipo">${[['anual','Anual'],['cuatrimestral','Cuatrim.'],['electiva','Electiva']].map(([v,t])=>`<option value="${v}" ${m.tipo===v?'selected':''}>${t}</option>`).join('')}</select></label>
      <label>Horas/sem<input class="inp" type="number" min="0" max="40" data-f="hs" value="${esc(m.hs)}"></label>
      ${m.tipo==='electiva'?`<label>Créditos<input class="inp" type="number" min="0" max="20" data-f="creditos" value="${esc(m.creditos)}"></label>`:m.tipo==='cuatrimestral'?`<label>Cuatrim.<select class="inp" data-f="cuat"><option value="1C" ${m.cuat==='1C'?'selected':''}>1.º</option><option value="2C" ${m.cuat==='2C'?'selected':''}>2.º</option></select></label>`:'<span></span>'}
    </div>
    <div class="ed-l3"><label>Regulares para cursar<input class="inp" data-f="reg" value="${esc(m.reg)}" placeholder="ej: 1, 7"></label><label>Aprobadas para cursar<input class="inp" data-f="apr" value="${esc(m.apr)}" placeholder="ej: 2"></label></div>
  </div>`;
}

function renderCargar(){
  const el=$('#panel-cargar');
  if(CARGA.paso==='ver'){ renderVer(el); return; }
  if(CARGA.paso==='ia'){ renderIA(el); return; }
  if(CARGA.paso==='inicio'){
    const tieneIA=!!SAMPLE||LECTOR_OK;
    const pdfAbierto=CARGA.pdf||CARGA.archivos.length||CARGA.estado;
    el.innerHTML=`
      <div class="sec-head" style="justify-content:space-between"><h2>${S.inicio?'Cargar una carrera':`Hola${S.perfil.nombre?', '+esc(S.perfil.nombre):''}! Buscá tu carrera`}</h2><button type="button" class="btn" id="c-cancel">Volver</button></div>
      <label class="field" for="c-buscar">Buscá tu carrera<input id="c-buscar" class="inp" type="search" autocomplete="off" placeholder="Ej: Industrial UTN Córdoba" value="${esc(CARGA.q||'')}"></label>
      <div class="res" id="c-res"></div>
      <div class="lbl" style="margin-top:10px">¿No está tu carrera? Cargala vos</div>
      ${tieneIA?`<button type="button" class="big-opt ${pdfAbierto?'on':''}" id="c-op-pdf"><span class="ic">⇪</span><b>Subir el PDF</b><span class="muted small">Cursable lo lee con IA y arma el plan.</span></button>
      ${pdfAbierto?`<label class="field" for="c-nombre">¿Qué carrera es?<input id="c-nombre" class="inp" placeholder="Ej: Ingeniería Civil · Plan 2023 · UTN FRC" value="${esc($('#c-nombre')?.value||'')}"></label>
      <label class="drop" id="drop" for="c-file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <b>${CARGA.archivos.length?CARGA.archivos.map(f=>esc(f.name)).join(', '):'Elegí el PDF o fotos del régimen de correlativas'}</b>
        <span class="muted small">${CARGA.archivos.length?'Tocá para cambiarlo':'Después lo revisás antes de guardarlo.'}</span>
        <input type="file" id="c-file" accept="application/pdf,image/*" multiple hidden>
      </label>
      ${CARGA.estado?`<div class="status"><span class="spin"></span><span>${esc(CARGA.estado)}</span><button type="button" class="btn" id="c-stop" style="margin-left:auto">Parar</button></div>`
        :`<button type="button" class="btn primary" id="c-leer" ${CARGA.archivos.length?'':'disabled'}>Leer el plan</button>`}
      ${SAMPLE?`<p class="hint">Usa tu cuenta de Claude: la primera vez te pide permiso.</p>`:''}`:''}`:''}
      ${CARGA.error?`<div class="status bad">${esc(CARGA.error)}</div>`:''}
      <button type="button" class="big-opt" id="c-op-ia"><span class="ic">✦</span><b>Usá tu propia IA</b><span class="muted small">Le pasás el PDF a ChatGPT, Gemini o Claude con un pedido que te damos, y pegás la respuesta.</span></button>
      <button type="button" class="big-opt" id="c-manual"><span class="ic">✎</span><b>Cargarla a mano</b><span class="muted small">Agregás cada materia con sus correlativas.</span></button>
      <details class="sec"><summary>Pegar un plan que te compartieron</summary>
        <textarea id="c-paste" placeholder="Pegá acá el plan copiado desde “Copiar plan para compartir”" aria-label="Plan compartido"></textarea>
        <button type="button" class="btn" id="c-import">Usar este plan</button></details>`;
    renderRes(); cargarBanco();
    return;
  }
  // revisar / editar
  const errs=CARGA.errs||[];
  const bad=new Set(errs.filter(e=>e.i>=0).map(e=>e.i+':'+e.f));
  const anios={}; ED.materias.forEach(m=>{const k=m.tipo==='electiva'?'E':(+m.nivel||1); anios[k]=(anios[k]||0)+1;});
  el.innerHTML=`
    <div class="sec-head" style="justify-content:space-between"><h2>Revisá el plan</h2><button type="button" class="btn" id="c-cancel">Cancelar</button></div>
    <div class="total"><div class="total-row"><span><b>${ED.materias.length}</b> <span class="muted">materias</span></span>
      ${Object.entries(anios).sort().map(([k,n])=>`<span><b>${n}</b> <span class="muted">${k==='E'?'electivas':k+'.º año'}</span></span>`).join('')}</div>
      <button type="button" class="btn primary" id="c-guardar">Guardar y usar este plan</button></div>
    ${ED.dudas?.length?`<div class="dudas"><b>Fijate en esto:</b><ul>${ED.dudas.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`:''}
    ${errs.length?`<div class="status bad" style="display:block"><b>Hay ${errs.length} ${pl(errs.length,'cosa','cosas')} para corregir:</b><ul style="margin:4px 0 0;padding-left:18px;font-weight:400">${errs.slice(0,8).map(e=>`<li>${esc(e.t)}</li>`).join('')}</ul></div>`:''}
    <label class="field" for="ed-nombre">Nombre de la carrera<input id="ed-nombre" class="inp ${errs.some(e=>e.i===-1&&e.f==='nombre')?'err':''}" value="${esc(ED.nombre)}"></label>
    <div class="meta3">${[['uni','Universidad','Ej: UTN · FR Córdoba'],['ciudad','Ciudad','Ej: Córdoba'],['pais','País','Ej: Argentina']].map(([f,t,ph])=>
      `<label class="field" for="ed-${f}">${t}<input id="ed-${f}" class="inp ${errs.some(e=>e.i===-1&&e.f===f)?'err':''}" value="${esc(ED[f]||'')}" placeholder="${ph}"></label>`).join('')}</div>
    ${LECTOR_URL?`<label class="check"><input type="checkbox" id="ed-compartir" ${ED.compartir?'checked':''}><span><b>Compartirlo en el banco</b><br><span class="muted small">Así los que estudian lo mismo lo encuentran sin cargarlo. Solo se comparte el plan, nunca tus notas ni tu avance.</span></span></label>`:''}
    <label class="field" for="ed-cred">Créditos de electivas que pide el título (0 si no aplica)<input id="ed-cred" class="inp" type="number" min="0" max="100" value="${esc(ED.creditosReq)}" style="max-width:8rem"></label>
    <p class="hint">Las correlativas van con los códigos de las materias, separados por coma.</p>
    <div class="ed" id="ed-list">${ED.materias.map(edRow).join('')}</div>
    <button type="button" class="btn" id="c-add">+ Agregar materia</button>`;
  // marcar campos con error
  for(const k of bad){ const [i,f]=k.split(':'); el.querySelector(`.ed-row[data-i="${i}"] [data-f="${f}"]`)?.classList.add('err'); }
}

function guardarEd(){
  const errs=validarEd();
  if(errs.length){ CARGA.errs=errs; renderCargar(); window.scrollTo(0,0); return; }
  const plan=edAPlan(), compartir=ED.compartir&&!!LECTOR_URL;
  S.planes[plan.id]=plan; S.inicio=true; usarPlan(plan.id); save(); CARGA.errs=null;
  if(compartir) compartirPlan(plan);
  cerrarCargar();
}

// ---------- Eventos ----------
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#sheet-close')||t.id==='backdrop'){ closeSheet(); return; }
  if(t.closest('#b-plan')){ openSheet('@planes'); return; }
  const pb=t.closest('[data-plan]'); if(pb){ usarPlan(pb.dataset.plan); save(); OPEN=null; renderSheet(); renderAll(); return; }
  const cg=t.closest('[data-cargar]'); if(cg){ abrirCargar(cg.dataset.cargar); return; }
  if(t.id==='b-share'){ const txt=JSON.stringify({tipo:'plan-estado-academico',v:1,plan:{...PLAN,builtin:undefined}}); const m=$('#share-msg');
    const fb=()=>{ m.textContent='No pude copiar. Probá desde otro navegador.'; };
    try{ navigator.clipboard.writeText(txt).then(()=>{m.textContent='Copiado. Mandáselo a quien quieras: lo pega en “Cargar otra carrera”.';},fb);}catch(_){fb();} return; }
  if(t.id==='b-delplan'){ if(t.dataset.armed){ delete S.planes[S.planId]; delete S.prog[S.planId]; usarPlan('ind2023'); save(); OPEN=null; renderSheet(); renderAll(); } else { t.dataset.armed='1'; t.textContent='Tocá de nuevo para borrar'; } return; }
  // bienvenida
  if(t.id==='w-seguir'){ seguirBienvenida(); return; }
  if(t.id==='w-entrar'){ entrarConCodigo($('#w-cod').value,$('#w-cmsg')); return; }
  if(t.id==='s-crear'){ crearCodigo(); return; }
  if(t.id==='s-entrar'){ entrarConCodigo($('#s-cod').value,$('#s-msg')); return; }
  if(t.id==='s-salir'){ S.sync={codigo:'',t:0}; SYNC_EST=''; clearTimeout(SYNC_T); guardarLocal(); renderSync(); return; }
  if(t.id==='s-copiar'){ try{ navigator.clipboard.writeText(S.sync.codigo).then(()=>{ t.textContent='Copiado ✓'; }); }catch(_){} return; }
  if(t.id==='w-restore'){ try{ aplicarRespaldo(JSON.parse($('#w-backup').value)); renderAll(); }catch(_){ $('#w-msg').textContent=' Ese texto no es un respaldo válido.'; } return; }
  // pantalla de carga
  if(t.id==='c-cancel'){ cerrarCargar(); return; }
  if(t.id==='c-leer'){ leerConClaude(); return; }
  if(t.id==='c-stop'){ CTL?.abort(); return; }
  const vr=t.closest('[data-ver]'); if(vr){ verPlan(vr.dataset.ver); return; }
  if(t.id==='c-volver'){ CARGA.paso='inicio'; CARGA.error=null; renderCargar(); window.scrollTo(0,0); return; }
  if(t.id==='c-adoptar'){ adoptar(); return; }
  if(t.id==='c-corregir'&&CARGA.ver?.estado==='ok'){ ED=planAEd(planDelBanco(CARGA.ver)); ED.compartir=!!LECTOR_URL; ED.banco=''; CARGA.paso='revisar'; renderCargar(); window.scrollTo(0,0); return; }
  if(t.id==='c-reportar'&&CARGA.ver){ const v=CARGA.ver; v.reportado=true; renderCargar(); fetch(API()+'/planes/'+encodeURIComponent(v.id)+'/reportar',{method:'POST'}).catch(()=>{}); return; }
  if(t.closest('#c-op-pdf')){ CARGA.pdf=!CARGA.pdf; renderCargar(); return; }
  if(t.closest('#c-op-ia')){ CARGA.paso='ia'; CARGA.error=null; renderCargar(); window.scrollTo(0,0); return; }
  if(t.id==='c-copiar-ia'){ const txt=PROMPT_IA(), m=$('#ia-msg');
    const fb=()=>{ $('#ia-ver').open=true; const ta=$('#ia-prompt'); ta.focus(); ta.select(); m.textContent='Seleccioné el pedido: copialo.'; };
    try{ navigator.clipboard.writeText(txt).then(()=>{ m.textContent='Copiado ✓'; },fb); }catch(_){ fb(); } return; }
  if(t.id==='c-ia-usar'){ try{ ED=completarLugar(parsePegado($('#c-ia-resp').value)); CARGA.paso='revisar'; CARGA.error=null; window.scrollTo(0,0); }
    catch(_){ CARGA.error='No encontré un plan en ese texto. Copiá la respuesta completa de tu IA, desde la primera { hasta la última }.'; }
    renderCargar(); return; }
  if(t.closest('#c-manual')){ ED={id:nuevoId(),nombre:$('#c-nombre')?.value.trim()||'',creditosReq:0,dudas:[],uni:'',ciudad:'',pais:'',compartir:!!LECTOR_URL,...completarLugar({}),materias:[{id:'1',nombre:'',nivel:1,tipo:'anual',cuat:'',hs:0,creditos:0,reg:'',apr:''}]}; CARGA.paso='revisar'; renderCargar(); return; }
  if(t.id==='c-import'){ try{ ED=completarLugar(parsePegado($('#c-paste').value)); CARGA.paso='revisar'; CARGA.error=null; }
    catch(_){ CARGA.error='Ese texto no es un plan válido. Pegá exactamente lo que te copiaron.'; }
    renderCargar(); return; }
  if(t.id==='c-add'){ const last=ED.materias[ED.materias.length-1]; const n=ED.materias.reduce((a,m)=>Math.max(a,/^\d+$/.test(m.id)?+m.id:0),0)+1;
    ED.materias.push({id:String(n),nombre:'',nivel:last?.nivel||1,tipo:'anual',cuat:'',hs:0,creditos:0,reg:'',apr:''}); renderCargar();
    $('#ed-list').lastElementChild?.querySelector('[data-f="nombre"]')?.focus(); return; }
  const del=t.closest('[data-del]'); if(del){ ED.materias.splice(+del.dataset.del,1); renderCargar(); return; }
  if(t.id==='c-guardar'){ guardarEd(); return; }
  // estados de una materia
  const set=t.closest('[data-set]');
  if(set&&OPEN){ const r=rec(OPEN); r.e=set.dataset.set; if(r.e==='falta'&&!r.vence&&!r.nota) delete P().m[OPEN]; SUG=null; save(); renderAll(); renderSheet();
    if(r.e==='media'&&!r.vence) $('#vence')?.focus(); return; }
  const op=t.closest('[data-open]'); if(op){ openSheet(op.dataset.open); return; }
  const tg=t.closest('[data-toggle]'); if(tg){ const id=tg.dataset.toggle, sel=P().sel; P().sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id]; save(); const y=window.scrollY; renderArmar(); window.scrollTo(0,y); return; }
  if(t.id==='b-sug'){ SUG=sugerir(analisisProximo().pod, S.cfg.horas); renderArmar(); return; }
  const u=t.closest('[data-usar]'); if(u&&SUG){ P().sel=[...SUG[+u.dataset.usar].sel]; save(); renderArmar(); return; }
  const tab=t.closest('[data-tab]');
  if(tab){ for(const x of document.querySelectorAll('[data-tab]')) x.setAttribute('aria-selected', x===tab);
    for(const p of ['plan','prox','armar','ysi','fin']) $('#panel-'+p).hidden = p!==tab.dataset.tab;
    window.scrollTo(0,0); try{localStorage.setItem(KEY+'-tab',tab.dataset.tab)}catch(_){} }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&OPEN) closeSheet(); if(e.key==='Enter'&&e.target.id==='w-cod') entrarConCodigo(e.target.value,$('#w-cmsg')); else if(e.key==='Enter'&&e.target.closest?.('#panel-bienvenida')&&e.target.tagName==='INPUT') seguirBienvenida(); });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='c-buscar'){ CARGA.q=t.value; renderRes(); return; }
  if(t.id==='ed-nombre'&&ED) ED.nombre=t.value;
  else if(/^ed-(uni|ciudad|pais)$/.test(t.id)&&ED){ ED[t.id.slice(3)]=t.value; t.classList.remove('err'); }
  else if(t.id==='ed-cred'&&ED) ED.creditosReq=t.value;
  else if(t.dataset.f&&ED){ const row=t.closest('.ed-row'); if(row){ ED.materias[+row.dataset.i][t.dataset.f]=t.value; t.classList.remove('err'); } }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f==='tipo'&&ED){ const i=+t.closest('.ed-row').dataset.i; ED.materias[i].tipo=t.value; if(t.value==='cuatrimestral'&&!ED.materias[i].cuat) ED.materias[i].cuat='1C'; t.closest('.ed-row').outerHTML=edRow(ED.materias[i],i); return; }
  if(t.id==='ed-compartir'&&ED){ ED.compartir=t.checked; return; }
  if(t.id==='c-file'){ CARGA.archivos=[...t.files]; CARGA.error=null; renderCargar(); return; }
  if(t.id==='vence'&&OPEN){ rec(OPEN).vence=t.value; save(); renderAll(); renderSheet(); }
  else if(t.id==='nota'&&OPEN){ rec(OPEN).nota=t.value; save(); }
  else if(t.id==='cfg-horas'){ S.cfg.horas=+t.value; SUG=null; save(); renderArmar(); }
});
// arrastrar y soltar el PDF
document.addEventListener('dragover',e=>{ const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ e.target.closest?.('#drop')?.classList.remove('over'); });
document.addEventListener('drop',e=>{ const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); CARGA.archivos=[...e.dataTransfer.files].filter(f=>/pdf|image/.test(f.type)); CARGA.error=null; renderCargar(); } });

const msg=s=>{ $('#b-msg').textContent=s; setTimeout(()=>{$('#b-msg').textContent=''},3000); };
$('#b-copy').addEventListener('click',()=>{
  const txt=JSON.stringify(S), ta=$('#backup'); ta.value=txt;
  const fb=()=>{ ta.select(); msg('Seleccioné el texto: copialo.'); };
  try{ navigator.clipboard.writeText(txt).then(()=>msg('Copiado.'),fb); }catch(_){ fb(); }
});
$('#b-restore').addEventListener('click',()=>{
  try{ aplicarRespaldo(JSON.parse($('#backup').value)); renderAll(); msg('Restaurado.'); }
  catch(_){ msg('Ese texto no es un respaldo válido.'); }
});
let armed=false;
$('#b-reset').addEventListener('click',e=>{
  if(!armed){ armed=true; e.target.textContent='Tocá de nuevo: borra tu progreso en esta carrera'; setTimeout(()=>{armed=false;e.target.textContent='Borrar todo';},4000); return; }
  S.prog[S.planId]={m:{},sel:[]}; SUG=null; save(); renderAll(); armed=false; e.target.textContent='Borrar todo'; msg('Listo.');
});

usarPlan(S.planId);
renderAll();
try{ const t=localStorage.getItem(KEY+'-tab'); if(t){ document.querySelector(`[data-tab="${t}"]`)?.click(); } }catch(_){}
bajarSync();
if(LECTOR_URL) fetch(API()+'/estado').then(r=>r.ok?r.json():{}).then(j=>{ LECTOR_OK=!!j.lector; if(document.body.classList.contains('cargando')&&CARGA.paso==='inicio') renderCargar(); }).catch(()=>{});
// Claude disponible solo dentro de un visor de Claude
(async()=>{ try{ SAMPLE = window.claude ? await window.claude.use('sample') : null; }catch(_){ SAMPLE=null; } if(document.body.classList.contains('cargando')&&CARGA.paso==='inicio') renderCargar(); })();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
